server {
    listen 3500;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing - unknown paths fall back to
    # index.html instead of nginx's default 404, matching CRA's own dev
    # server behavior.
    location / {
        try_files $uri /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
