<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM-GRADE Video Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            margin-bottom: 10px;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .help-text {
            color: #999;
            font-size: 12px;
            margin-top: -8px;
            margin-bottom: 15px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }
        
        .status.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            display: block;
        }
        
        .status.loading {
            background: #d1ecf1;
            border: 2px solid #0c5460;
            color: #0c5460;
            display: block;
        }
        
        .videos-list {
            margin-top: 40px;
            border-top: 2px solid #e0e0e0;
            padding-top: 30px;
        }
        
        .videos-list h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .video-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .video-id {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .video-status {
            font-size: 12px;
            color: #666;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 TEAM-GRADE</h1>
        <p class="subtitle">Football Video Analysis Pipeline</p>
        
        <form id="uploadForm">
            <div class="form-section">
                <label for="videoUrl">YouTube URL</label>
                <input 
                    type="text" 
                    id="videoUrl" 
                    placeholder="https://www.youtube.com/watch?v=..." 
                    required
                >
                <p class="help-text">Enter a YouTube video URL to analyze</p>
            </div>
            
            <div class="form-section">
                <label for="teamId">Team ID</label>
                <input 
                    type="text" 
                    id="teamId" 
                    placeholder="e.g., OHIO_STATE_2024" 
                    value="TEST_TEAM"
                >
                <p class="help-text">Optional: Team identifier for organization</p>
            </div>
            
            <div class="form-section">
                <label for="playerNumber">Player Jersey Number</label>
                <input 
                    type="number" 
                    id="playerNumber" 
                    placeholder="e.g., 7" 
                    min="0" 
                    max="99"
                >
                <p class="help-text">Optional: Jersey number to track</p>
            </div>
            
            <div class="form-section">
                <label for="position">Position</label>
                <select id="position">
                    <option value="">Auto-detect</option>
                    <option value="QB">QB - Quarterback</option>
                    <option value="RB">RB - Running Back</option>
                    <option value="WR">WR - Wide Receiver</option>
                    <option value="OL">OL - Offensive Line</option>
                    <option value="DL">DL - Defensive Line</option>
                    <option value="LB">LB - Linebacker</option>
                    <option value="DB">DB - Defensive Back</option>
                </select>
                <p class="help-text">Optional: Position for trait analysis</p>
            </div>
            
            <button type="submit">📤 Start Analysis</button>
        </form>
        
        <div id="status" class="status"></div>
        
        <div class="videos-list" id="videosList" style="display: none;">
            <h2>📊 Processing Videos</h2>
            <div id="videosContainer"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let allVideos = {};
        
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const teamId = document.getElementById('teamId').value.trim();
            const playerNumber = document.getElementById('playerNumber').value;
            const position = document.getElementById('position').value;
            
            const statusEl = document.getElementById('status');
            
            try {
                statusEl.className = 'status loading';
                statusEl.innerHTML = '<span class="spinner"></span>Submitting video for analysis...';
                
                const response = await fetch(`${API_BASE}/ingest`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        video_url: videoUrl,
                        team_id: teamId || undefined,
                        player_number: playerNumber ? parseInt(playerNumber) : undefined,
                        position: position || undefined,
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to submit video');
                }
                
                const data = await response.json();
                const videoId = data.video_id;
                
                allVideos[videoId] = {
                    id: videoId,
                    url: videoUrl,
                    status: 'queued',
                    stages: {},
                    progress: 0
                };
                
                statusEl.className = 'status success';
                statusEl.innerHTML = `✅ Video submitted! ID: <strong>${videoId}</strong><br>Monitoring progress...`;
                
                document.getElementById('uploadForm').reset();
                document.getElementById('videosList').style.display = 'block';
                
                // Start polling for status
                pollVideoStatus(videoId);
                updateVideosList();
                
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `❌ Error: ${error.message}`;
                console.error('Upload error:', error);
            }
        });
        
        async function pollVideoStatus(videoId) {
            const pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/ingest/${videoId}/status`);
                    
                    if (!response.ok) {
                        clearInterval(pollInterval);
                        return;
                    }
                    
                    const data = await response.json();
                    
                    if (allVideos[videoId]) {
                        allVideos[videoId].status = data.status;
                        allVideos[videoId].stages = data.stages || {};
                        
                        // Calculate progress
                        const stages = Object.keys(data.stages || {}).length;
                        const completedStages = Object.values(data.stages || {})
                            .filter(s => s.status === 'completed').length;
                        allVideos[videoId].progress = stages > 0 ? (completedStages / 9) * 100 : 0;
                        
                        updateVideosList();
                        
                        if (data.status === 'completed' || data.status === 'failed') {
                            clearInterval(pollInterval);
                        }
                    }
                } catch (error) {
                    console.error('Poll error:', error);
                }
            }, 3000);
        }
        
        function updateVideosList() {
            const container = document.getElementById('videosContainer');
            container.innerHTML = Object.values(allVideos)
                .map(video => `
                    <div class="video-item">
                        <div class="video-id">Video: ${video.id}</div>
                        <div class="video-status">
                            Status: <strong>${video.status}</strong> 
                            ${video.progress > 0 ? `(${Math.round(video.progress)}% complete)` : ''}
                        </div>
                        ${video.progress > 0 ? `
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${video.progress}%"></div>
                            </div>
                        ` : ''}
                        ${video.status === 'completed' ? `
                            <p style="margin-top: 10px; color: #28a745; font-weight: 600;">
                                ✅ Analysis complete! View results at /api/analysis/${video.id}
                            </p>
                        ` : ''}
                    </div>
                `)
                .join('');
        }
    </script>
</body>
</html>
