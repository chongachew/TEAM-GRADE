[pytest]
# Pytest configuration for TEAM-GRADE test suite

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test output
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests with mocked services
    endpoints: API endpoint tests
    validators: Validator tests
    exceptions: Exception handling tests
    slow: Tests that take longer to run

# Minimum Python version
minversion = 3.9

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = .git .venv venv __pycache__ build dist *.egg

# Coverage options
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*.py
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
