name: Python Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'team-grade-processing/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'team-grade-processing/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.9 dropped: sam2/rfdetr/torch/torchvision (multi-player tracking
        # pipeline deps) all declare Requires-Python >= 3.10.
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./team-grade-processing
      # NOTE: previously "../requirements.txt", which resolves to the repo-root
      # requirements.txt (a different, older dependency list lacking mediapipe/
      # easyocr/ultralytics/paddleocr/torch/sam2/rfdetr) instead of this
      # directory's own requirements.txt - CI was never installing the real
      # pipeline dependencies. Fixed to install the correct file.
      # --extra-index-url matches the Dockerfile's own CPU-only pin - without
      # it pip resolves the default CUDA torch wheels (~2GB+ of nvidia-*
      # packages), filling the runner's disk (`No space left on device`)
      # before tests that never touch a GPU even get to run.
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio "moto[s3]"

    - name: Run Validator Tests
      working-directory: ./team-grade-processing
      run: |
        pytest tests/test_validators.py -v --tb=short

    - name: Run Exception Tests
      working-directory: ./team-grade-processing
      run: |
        pytest tests/test_exceptions.py -v --tb=short

    - name: Run Simplified Endpoint Tests
      working-directory: ./team-grade-processing
      run: |
        pytest tests/test_endpoints_simplified.py -v --tb=short

    - name: Run Multi-Player Pipeline Tests
      working-directory: ./team-grade-processing
      # Fast/mocked tests only - test_tracking.py is excluded here (pytest.ini
      # "slow" marker): it loads the real SAM2 model and needs a 156MB
      # checkpoint download (see models/README.md), too expensive for routine
      # CI. Run it manually or wire into a separate scheduled workflow.
      run: |
        pytest tests/test_biomechanics_stage_vectorized.py tests/test_settings_completeness.py \
          tests/test_motion_compensation.py tests/test_pose_track_matching.py \
          tests/test_detection_stage.py tests/test_rep_extraction_stage.py -v --tb=short

    - name: Generate Coverage Report
      working-directory: ./team-grade-processing
      run: |
        pytest tests/test_endpoints_simplified.py tests/test_exceptions.py tests/test_validators.py \
          tests/test_biomechanics_stage_vectorized.py tests/test_settings_completeness.py \
          tests/test_motion_compensation.py tests/test_pose_track_matching.py \
          tests/test_detection_stage.py tests/test_rep_extraction_stage.py \
          --cov=api --cov=ingest --cov=processing --cov-report=xml --cov-report=term-missing

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./team-grade-processing/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
