name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./team-grade-processing
      # See python-tests.yml: "../requirements.txt" resolved to the wrong
      # (repo-root) file; fixed to install this directory's own requirements.
      # --extra-index-url matches the Dockerfile's own CPU-only pin - see
      # python-tests.yml for why this avoids filling the runner's disk.
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Integration Tests
      working-directory: ./team-grade-processing
      run: |
        pytest tests/ -v --tb=short -k "integration"

    - name: Start API server and check health endpoint
      working-directory: ./team-grade-processing
      run: |
        python -m pip install requests
        uvicorn api.server:app --port 8000 &
        SERVER_PID=$!
        sleep 5
        curl -sf http://localhost:8000/api/health
        kill $SERVER_PID
