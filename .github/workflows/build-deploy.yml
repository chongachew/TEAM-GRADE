name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Build Python backend
      working-directory: ./team-grade-processing
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt
        python -m py_compile api/server.py
        python -m py_compile ingest/ingest_pipeline_worker.py

    - name: Build Node.js frontend
      working-directory: ./team-grade-frontend
      run: |
        npm ci
        npm run build

    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          team-grade-processing/api/
          team-grade-processing/ingest/
          team-grade-frontend/build/
        retention-days: 30
