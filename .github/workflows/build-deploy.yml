name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 455646290581.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Build Python backend
      working-directory: ./team-grade-processing
      # See python-tests.yml: "../requirements.txt" resolved to the wrong
      # (repo-root) file; fixed to install this directory's own requirements.
      # --extra-index-url matches the Dockerfile's own CPU-only pin - without
      # it pip resolves the default CUDA torch wheels (~2GB+ of nvidia-*
      # packages), which fills the runner's disk (`No space left on device`)
      # before this pure py_compile sanity check ever needs a GPU at all.
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
        python -m py_compile api/server.py
        python -m py_compile ingest/ingest_pipeline_worker.py

    - name: Build Node.js frontend
      working-directory: ./team-grade-frontend
      run: |
        npm ci
        npm run build

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          team-grade-processing/api/
          team-grade-processing/ingest/
          team-grade-frontend/build/
        retention-days: 30

  # ── Deploy (main branch only) ────────────────────────────────────────────
  # Pushes 3 images to the ECR repos created for this project
  # (team-grade-api, team-grade-worker, team-grade-web) and force-deploys new
  # ECS task revisions onto the existing bridge-cluster (reused from Bridge
  # Athletics - see docs/infrastructure-plan.md for why this doesn't need its
  # own cluster/VPC). Migrations run via a one-off Fargate task using the
  # team-grade-api image (see "Run DB migrations" below) - unlike Bridge
  # Athletics' own deploy.yml, which uses a separate VPC-attached Lambda
  # (bridge-db-migrate) for its Node/Drizzle migrations. TEAM-GRADE's
  # codebase is Python/Alembic and already deploys via ECS/Fargate that can
  # reach team-grade-db directly, so reusing that path is simpler than
  # standing up a second, Python-specific Lambda just for this.
  #
  # This step was MISSING for a while after the Postgres migration
  # (Phase 1->2) actually landed - this comment used to say "No DB migration
  # step yet: Phase 1 keeps TEAM-GRADE on Firestore", which went stale the
  # moment Phase 2 shipped and nobody added the step. Concretely: the
  # plays.clip_ready column (2026-07-28) was live in code and deployed to
  # ECS while the production database never got the matching migration,
  # 500ing every request that touched the `plays` table (including the
  # watch page's own status poll) until the migration was run manually.
  deploy:
    name: Deploy to bridge-cluster
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::455646290581:role/team-grade-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./team-grade-processing
          target: api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/team-grade-api:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/team-grade-api:latest
          cache-from: type=gha,scope=team-grade-api
          cache-to: type=gha,mode=max,scope=team-grade-api

      - name: Build & push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./team-grade-processing
          target: worker
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/team-grade-worker:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/team-grade-worker:latest
          cache-from: type=gha,scope=team-grade-worker
          cache-to: type=gha,mode=max,scope=team-grade-worker

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./team-grade-frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/team-grade-web:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/team-grade-web:latest
          build-args: |
            REACT_APP_API_BASE=https://film-api.the-bridge.app

      # AWS Batch's job definition references this image as :latest (no
      # revision-pinned digest), so pushing a new :latest here is all the
      # next submitted detection/tracking job needs to pick it up - no
      # ECS-style service/deployment step applies to Batch. This was
      # previously a manual-only build, discovered stale in production
      # 2026-07-22 (a real code fix had been pushed but never reached this
      # image) - now kept in sync automatically like the other three.
      - name: Build & push GPU Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./team-grade-processing
          file: ./team-grade-processing/Dockerfile.gpu
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/team-grade-worker-gpu:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/team-grade-worker-gpu:latest
          cache-from: type=gha,scope=team-grade-worker-gpu
          cache-to: type=gha,mode=max,scope=team-grade-worker-gpu

      - name: Register new API task definition
        id: api-taskdef
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition team-grade-api --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "${{ env.ECR_REGISTRY }}/team-grade-api:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy)')
          NEW_REVISION=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "revision=$NEW_REVISION" >> "$GITHUB_OUTPUT"

      - name: Run DB migrations
        # One-off Fargate task, same image/task-def just registered above
        # (so alembic/versions/ matches exactly what's about to be deployed,
        # not whatever team-grade-api happened to be running before this
        # push) and the same network config as the live service, so it can
        # reach team-grade-db inside its private subnets. Runs BEFORE the
        # service is updated - migrations must be additive/backward-
        # compatible with the currently-running old code either way, same
        # constraint Bridge Athletics' migrate-then-deploy Lambda step
        # already lives under.
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services --cluster bridge-cluster --services team-grade-api --query 'services[0].networkConfiguration' --output json)
          TASK_ARN=$(aws ecs run-task \
            --cluster bridge-cluster \
            --task-definition "${{ steps.api-taskdef.outputs.revision }}" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"team-grade-api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster bridge-cluster --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster bridge-cluster --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task exited with code $EXIT_CODE - see /ecs/team-grade-api logs for this task"
            aws ecs describe-tasks --cluster bridge-cluster --tasks "$TASK_ARN" --query 'tasks[0].{stoppedReason:stoppedReason,reason:containers[0].reason}'
            exit 1
          fi
          echo "Migrations applied successfully"

      - name: Deploy API to ECS
        run: |
          aws ecs update-service --cluster bridge-cluster --service team-grade-api --task-definition "${{ steps.api-taskdef.outputs.revision }}" --force-new-deployment

      - name: Deploy Worker to ECS
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition team-grade-worker --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "${{ env.ECR_REGISTRY }}/team-grade-worker:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy)')
          NEW_REVISION=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster bridge-cluster --service team-grade-worker --task-definition "$NEW_REVISION" --force-new-deployment

      - name: Deploy Web to ECS
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition team-grade-web --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "${{ env.ECR_REGISTRY }}/team-grade-web:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy)')
          NEW_REVISION=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster bridge-cluster --service team-grade-web --task-definition "$NEW_REVISION" --force-new-deployment

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable --cluster bridge-cluster --services team-grade-api team-grade-worker team-grade-web
          echo "Deployment complete - ${{ github.sha }}"
