name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      working-directory: ./team-grade-processing
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt
        pip install pylint flake8 black isort pytest

    - name: Check code formatting with Black
      working-directory: ./team-grade-processing
      run: |
        black --check --diff . || echo "Format issues found (non-blocking)"
      continue-on-error: true

    - name: Check import sorting with isort
      working-directory: ./team-grade-processing
      run: |
        isort --check-only --diff . || echo "Import sorting issues found (non-blocking)"
      continue-on-error: true

    - name: Lint with Pylint
      working-directory: ./team-grade-processing
      run: |
        find . -name "*.py" -type f | xargs pylint --fail-under=7.0 || echo "Linting issues found"
      continue-on-error: true

    - name: Lint with Flake8
      working-directory: ./team-grade-processing
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: Run Security Scan (bandit)
      working-directory: ./team-grade-processing
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        cat bandit-report.json || true
      continue-on-error: true

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./team-grade-processing
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      working-directory: ./team-grade-processing
      run: |
        pytest tests/test_endpoints_simplified.py tests/test_exceptions.py tests/test_validators.py \
          --cov=api --cov=ingest --cov-report=xml

    - name: SonarCloud Scan
      if: ${{ secrets.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true
