name: Node.js Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'team-grade-frontend/**'
      - 'node-api/**'
      - 'package.json'
      - '.github/workflows/node-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'team-grade-frontend/**'
      - 'node-api/**'
      - 'package.json'
      - '.github/workflows/node-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    # Was a 3 OS x 3 Node-version matrix (9 jobs) - trimmed to match what
    # build-deploy.yml actually builds with (Node 20.x on Linux; the frontend
    # is only ever built inside a Linux Docker image for deployment). GitHub
    # bills macOS runners at 10x and Windows at 2x the Linux-minute rate.

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      working-directory: ./team-grade-frontend
      run: npm ci

    - name: Run tests
      working-directory: ./team-grade-frontend
      run: npm test -- --watchAll=false

    - name: Build
      working-directory: ./team-grade-frontend
      run: npm run build

    - name: Check code vulnerabilities
      working-directory: ./team-grade-frontend
      run: npm audit --audit-level=moderate
      continue-on-error: true

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    
    - name: Run Snyk Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true
